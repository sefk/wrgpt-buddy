{% load static poker_extras %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}WRGPT Buddy{% endblock %}</title>
<link rel="stylesheet" href="{% static 'poker/poker.css' %}">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="{% url 'poker:current' %}">WRGPT Buddy</a>
  <nav>
    <a href="{% url 'poker:current' %}" {% if nav == 'current' %}aria-current="page"{% endif %}>Current</a>
    <a href="{% url 'poker:hands' %}" {% if nav == 'hands' %}aria-current="page"{% endif %}>History</a>
    <a href="{% url 'poker:analytics' %}" {% if nav == 'analytics' %}aria-current="page"{% endif %}>Analytics</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
{% block legend %}{% endblock %}
</main>
<footer>
  <a href="https://hands.wrgpt.org" rel="noopener">hands.wrgpt.org</a> ·
  <a href="https://www.wrgpt.org/manual" rel="noopener">Manual</a>
</footer>
<script src="{% static 'poker/progress.js' %}" defer></script>
</body>
</html>
