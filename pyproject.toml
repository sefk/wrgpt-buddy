[project]
name = "wrgpt-buddy"
version = "0.1.0"
description = "Local companion for WRGPT email poker"
authors = [
    { name = "Sef Kloninger", email = "sefklon@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "buddy.settings"
python_files = ["test_*.py", "tests.py"]
